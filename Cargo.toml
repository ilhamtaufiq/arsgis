[workspace]
resolver = "2"
members = ["crates/pipa-core", "crates/pipa-store", "crates/pipa-import", "crates/pipa-sync", "crates/pipa-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = { version = "9", default-features = false }

pipa-core = { path = "crates/pipa-core" }
pipa-store = { path = "crates/pipa-store" }
pipa-import = { path = "crates/pipa-import" }
pipa-sync = { path = "crates/pipa-sync" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
